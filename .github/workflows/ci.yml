name: Extension build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  extension-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify packaged extension entry points and copied assets
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
          assert.equal(manifest.manifest_version, 3);
          const files = [manifest.action.default_popup, manifest.background.service_worker, 'popup.js'];
          for (const entry of manifest.content_scripts) files.push(...entry.js, ...(entry.css || []));
          const root = path.resolve('dist');
          for (const file of files) {
            assert.equal(typeof file, 'string');
            const output = path.resolve(root, file);
            assert.ok(output.startsWith(root + path.sep));
            assert.ok(fs.statSync(output).isFile() && fs.statSync(output).size > 0, file);
          }
          assert.ok(fs.readFileSync('dist/popup.html', 'utf8').includes('popup.js'));
          JS
